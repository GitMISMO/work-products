name: Work Products
# First load (run by hand once) copies the website's current files here; every change to data/ rebuilds catalog.json.
on:
  workflow_dispatch:
    inputs:
      firstLoad:
        description: Copy the website's current list and files (first load)
        type: boolean
        default: false
      summaries:
        description: Rebuild the first-load summaries (sentence fix)
        type: boolean
        default: false
      repair:
        description: Check every saved file and copy damaged ones again from the originals
        type: boolean
        default: false
      patch:
        description: 'Change products, as JSON: {"<id>":{"field":value}}'
        type: string
        default: ''
  push:
    branches: [main]
    paths: ['data/**']
permissions:
  contents: write
concurrency: { group: work-products, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: First load
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.firstLoad }}
        run: node .github/wp/first-load.mjs
      - name: Fixes
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.summaries || inputs.patch != '') }}
        env:
          SUMMARIES: ${{ inputs.summaries }}
          PATCH: ${{ inputs.patch }}
        run: node .github/wp/fix.mjs
      - name: Repair damaged files
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repair }}
        run: node .github/wp/repair.mjs
      - name: Build catalog.json
        run: node .github/wp/build-catalog.mjs
      - name: Save
        run: |
          git config user.name "MMS Work Products"; git config user.email "workrequests@mismo.org"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -q -m "Work products: catalog.json rebuilt"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
